name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Build & Test (macOS)
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Format check
        run: zig fmt --check --ast-check build.zig apps packages tools

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Agent reliability eval (fake)
        run: |
          ./zig-out/bin/forge eval ai-flow --provider fake --min-success-rate 1.0 --output .forge/evals/ci.jsonl

      - name: Smoke test CLI
        run: |
          ./zig-out/bin/forge version
          ./zig-out/bin/forge doctor

  test-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Format check
        run: zig fmt --check --ast-check build.zig apps packages tools

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Agent reliability eval (fake)
        run: |
          ./zig-out/bin/forge eval ai-flow --provider fake --min-success-rate 1.0 --output .forge/evals/ci-linux.jsonl

      - name: Smoke test CLI
        run: |
          ./zig-out/bin/forge version
          ./zig-out/bin/forge doctor
          ./zig-out/bin/forge providers
          ./zig-out/bin/forge models list

  test-windows:
    name: Build (Windows)
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Format check
        run: zig fmt --check --ast-check build.zig apps packages tools

      - name: Build CLI
        run: zig build

      - name: Smoke test CLI
        run: |
          ./zig-out/bin/forge.exe version
          ./zig-out/bin/forge.exe doctor
