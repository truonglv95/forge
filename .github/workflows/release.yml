name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libfreetype-dev libfontconfig1-dev

      - name: Build
        run: zig build -Dwith-glx=false -Doptimize=ReleaseFast

      - name: Package
        run: |
          mkdir -p forge-linux-x86_64/bin
          cp zig-out/bin/forge forge-linux-x86_64/bin/
          cp README.md forge-linux-x86_64/
          cp LICENSE forge-linux-x86_64/
          tar czf forge-linux-x86_64.tar.gz forge-linux-x86_64/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-linux-x86_64
          path: forge-linux-x86_64.tar.gz

  build-macos:
    name: Build macOS arm64
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Package
        run: |
          mkdir -p forge-macos-arm64/bin
          cp zig-out/bin/forge forge-macos-arm64/bin/
          cp zig-out/bin/forge-ide forge-macos-arm64/bin/
          cp README.md forge-macos-arm64/
          cp LICENSE forge-macos-arm64/
          tar czf forge-macos-arm64.tar.gz forge-macos-arm64/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-macos-arm64
          path: forge-macos-arm64.tar.gz

  release:
    name: Create Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Forge v${{ steps.version.outputs.version }}
          body: |
            ## Forge v${{ steps.version.outputs.version }}

            ### Downloads
            - **Linux x86_64**: `forge-linux-x86_64.tar.gz`
            - **macOS arm64**: `forge-macos-arm64.tar.gz`

            ### Install
            ```bash
            # Linux
            tar xzf forge-linux-x86_64.tar.gz
            sudo cp forge-linux-x86_64/bin/forge /usr/local/bin/

            # macOS
            tar xzf forge-macos-arm64.tar.gz
            sudo cp forge-macos-arm64/bin/forge /usr/local/bin/

            # Verify
            forge version
            ```

            ### Quick Start
            ```bash
            forge agent          # Interactive TUI
            forge serve          # Mobile PWA on :7777
            forge ask "question" # Ask AI
            ```
          files: |
            artifacts/forge-linux-x86_64/forge-linux-x86_64.tar.gz
            artifacts/forge-macos-arm64/forge-macos-arm64.tar.gz
          draft: false
          prerelease: false
