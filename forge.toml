# Forge workspace configuration.
# The supported M0 schema is intentionally small and strict.

[project]
name = "forge"

[editor]
tab_width = 4

[theme]
preset = "dark"
# CSS-style font stack — first available font wins
font_family = "Menlo, Monaco, 'Courier New', monospace"
font_size = 14
font_weight = "regular"
line_height = 1.5
ui_font_size = 12

[ai]
# AI edits must remain review-only. Direct apply is not a supported mode.
apply_mode = "review"
# Provider: auto | fake | zai | gemini | ollama | openrouter | openai | anthropic | nvidia | groq | cerebras
# auto prefers forge_cloud if logged in, then z.ai if /etc/.z-ai-config exists,
# then Ollama when reachable, then credentials, then fake.
provider = "ollama"
model = "qwen3.5:35b"
# Ollama server URL. Change this to a remote server when local Ollama is unavailable.
ollama_url = "http://localhost:11434"
# Optional OpenRouter-compatible base URL. Requires OPENROUTER_API_KEY when provider = "openrouter".
openrouter_url = "https://openrouter.ai/api/v1"
# Embedding provider is configured separately from the chat model. It may reuse
# the same Ollama host, but should use an embedding model.
embedding_provider = "ollama"
embedding_model = "nomic-embed-text"
embedding_url = "http://localhost:11434"
# Enable MCP tools from .mcp.json (Cursor / VS Code compatible format)
mcp = true

# Free-tier providers (no credit card required):
#   z.ai (DEFAULT in dev) — pre-auth via /etc/.z-ai-config (run `npm i -g z-ai-web-dev-sdk`)
#     models: glm-4-plus, glm-4.5, glm-4.6, glm-4-flash, glm-zero, glm-4-long (1M ctx)
#   GROQ_API_KEY       — https://console.groq.com  (~500 tok/s, 30 RPM, 14k req/day)
#   CEREBRAS_API_KEY   — https://cloud.cerebras.ai (~2000 tok/s, 30 RPM, ~1M tok/day)
#   GEMINI_API_KEY     — https://aistudio.google.com (free tier, 15 RPM, 1M tok/day)
#   OPENROUTER_API_KEY — https://openrouter.ai (free `:free` suffix models, 20 req/day)
#   NVIDIA_API_KEY     — https://build.nvidia.com (free NIM endpoints)
# Then set provider = "zai" | "groq" | "cerebras" | "gemini" | "openrouter" | "nvidia" and
# model = "<model-id-from-`forge providers`>".
# See docs/AI_ECOSYSTEM.md and docs/evaluation/FREE_LLM_SOURCES_2026.md for full list.
